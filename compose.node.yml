# Node stack: Nethermind + Lighthouse. Always-on, runs 24/7.
#
# This file owns the execution + consensus clients. EMIT itself lives in
# `compose.emit.yml` — keep them separate because Nethermind must be fully
# synced before EMIT can do anything useful, and the node stack and the
# indexer have different lifecycles (node runs forever; importer is a
# one-shot; follower is long-running but restartable independent of the
# node).
#
# Mirrors the live Hetzner configuration (proven on i7-8700, 64 GB DDR4,
# Gen3 NVMe RAID0). Production storage at mainnet tip:
#   Nethermind data dir (bodies + receipts):  ~1-1.5 TB
#   Lighthouse beacon data:                   ~200 GB
#
# Network: host networking so EMIT (running from compose.emit.yml or
# directly on the host) can reach Nethermind at localhost:8545.
#
# Operator flow:
#   1. docker compose -f compose.node.yml up -d
#   2. Wait for Nethermind eth_syncing == false (hours to days from cold,
#      minutes from checkpoint). Check with:
#        curl -s -X POST -H "Content-Type: application/json" \
#          --data '{"jsonrpc":"2.0","method":"eth_syncing","params":[],"id":1}' \
#          http://localhost:8545
#   3. Proceed to compose.emit.yml for import + follow.

x-restart-policy: &restart unless-stopped

services:
  # Bootstrap shared JWT between execution and consensus clients.
  # Idempotent — only generates if the secret file is missing.
  setup_jwt:
    image: alpine:3.23.3
    volumes:
      - secrets:/secrets
    command: >
      sh -c '
      if [ ! -s /secrets/jwt.hex ]; then
        apk add --no-cache openssl &&
        openssl rand -hex 32 | tr -d "\n" > /secrets/jwt.hex &&
        echo "JWT generated";
      else
        echo "JWT already exists";
      fi
      '

  lighthouse:
    container_name: lighthouse
    image: sigp/lighthouse:v8.1.3
    restart: *restart
    network_mode: host
    volumes:
      - secrets:/secrets
      - ${LIGHTHOUSE_DATA_DIR:-./data/lighthouse}:/root/.lighthouse
    command: >
      lighthouse
      --network mainnet
      beacon
      --http
      --http-address 127.0.0.1
      --execution-endpoint http://127.0.0.1:8551
      --execution-jwt /secrets/jwt.hex
      --checkpoint-sync-url https://mainnet-checkpoint-sync.attestant.io
      --checkpoint-sync-url-timeout 600
    depends_on:
      setup_jwt:
        condition: service_completed_successfully

  nethermind:
    container_name: nethermind
    # Built from a pinned commit for `--LogIndex.Enabled`, which is not
    # in any stable Nethermind release as of this writing. Swap to a
    # stable image once LogIndex lands upstream.
    build:
      context: https://github.com/nethermindeth/nethermind.git#793d1ece9cf808b7a5871a65f900d451b9455a6b
    image: nethermind-logindex:793d1ec
    restart: *restart
    network_mode: host
    volumes:
      - secrets:/secrets
      - ${NETHERMIND_DATA_DIR:-./data/nethermind}:/data
    # Performance tuning for bare-metal 64 GB systems. See
    # docs.nethermind.io/fundamentals/performance-tuning for the upstream
    # guide; deltas vs default are commented inline.
    #
    # The --Sync.Download{Bodies,Receipts}InFastSync flags are explicit
    # here even though they default to true on recent Nethermind. EMIT's
    # RocksDB import path requires both.
    command: >
      --config mainnet
      --datadir /data
      --JsonRpc.Enabled true
      --JsonRpc.Host 127.0.0.1
      --JsonRpc.EngineHost 127.0.0.1
      --JsonRpc.EnginePort 8551
      --JsonRpc.JwtSecretFile /secrets/jwt.hex
      --LogIndex.Enabled true
      --Sync.DownloadBodiesInFastSync true
      --Sync.DownloadReceiptsInFastSync true
      --Sync.NonValidatorNode true
      --Pruning.CacheMb 4000
      --Db.StateDbWriteBufferSize 200000000
      --Db.StateDbEnableFileWarmer true
      --Blocks.PreWarmStateOnBlockProcessing false
      --Network.MaxOutgoingConnectPerSec 50
    ulimits:
      nofile: 1000000
    depends_on:
      setup_jwt:
        condition: service_completed_successfully

volumes:
  secrets:
