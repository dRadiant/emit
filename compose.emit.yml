# EMIT engine — import + follow.
#
# Companion to `compose.node.yml`. Assumes Nethermind is already running
# on the host at localhost:8545 and is fully synced (eth_syncing == false).
# If it isn't synced, `import` won't have receipts to read and `follow`
# will reject newHeads notifications.
#
# Two services with different lifecycles:
#   emit-engine-import   one-shot. Reads Nethermind's RocksDB receipts
#                        directly, materializes the flat log store, exits.
#                        Gated by the `import` profile so `up` doesn't run it.
#   emit-engine          long-running. Follows the chain head via JSON-RPC +
#                        WebSocket, atomically updates the pending ring.
#
# Operator flow (after compose.node.yml is up and synced):
#   docker compose -f compose.emit.yml --profile import up emit-engine-import
#   docker compose -f compose.emit.yml up -d emit-engine
#
# To re-import from scratch (e.g. after a corrupted flat store):
#   docker compose -f compose.emit.yml down
#   rm -rf ${EMIT_DATA_DIR:-./data/emit-engine}/*
#   docker compose -f compose.emit.yml --profile import up emit-engine-import
#   docker compose -f compose.emit.yml up -d emit-engine

services:
  # One-shot historical import. ~13 minutes for full mainnet on the
  # reference Hetzner box. Exits when done. The `import` profile keeps
  # this service out of the default `up` set so it doesn't accidentally
  # run on every restart.
  emit-engine-import:
    image: emit-engine:latest
    build: .
    profiles: [import]
    network_mode: host
    volumes:
      - ${EMIT_DATA_DIR:-./data/emit-engine}:/var/lib/emit-engine
      # Read-only mount of Nethermind's data dir. The receipts column
      # family lives at `nethermind_db/mainnet/receipts` inside the
      # mounted volume, not at `mainnet/receipts` as some older docs
      # suggest. Verified on the live Hetzner box.
      - ${NETHERMIND_DATA_DIR:-./data/nethermind}:/nethermind-data:ro
    command: >
      import
      --rocksdb /nethermind-data/nethermind_db/mainnet/receipts
      --data-dir /var/lib/emit-engine

  # Long-running head follower. Polls newHeads via WS, gap-fills via
  # JSON-RPC, atomically updates the pending ring. Safe to restart at any
  # time — picks up from meta.bin's last_finalized_block.
  emit-engine:
    container_name: emit-engine
    image: emit-engine:latest
    build: .
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${EMIT_DATA_DIR:-./data/emit-engine}:/var/lib/emit-engine
    command: >
      follow
      --rpc http://127.0.0.1:8545
      --ws ws://127.0.0.1:8546
      --data-dir /var/lib/emit-engine
